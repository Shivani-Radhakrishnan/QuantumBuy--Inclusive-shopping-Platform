name: ML service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-onnx-1110a24
      - run: pip install -r requirements-dev.txt
      - name: Tests (including reproduction of the published evaluation numbers)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantumbuy-ml -f ml/Dockerfile .
      - name: Smoke-test the container
        run: |
          docker run -d --name ml -p 8080:8080 quantumbuy-ml
          for i in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf "localhost:8080/search?q=boil+water+quickly&k=3" | tee /dev/stderr | grep -q "Electric Kettle"
          curl -sf -X POST localhost:8080/voice/parse -H 'Content-Type: application/json' \
            -d '{"text": "add two laptops"}' | tee /dev/stderr | grep -q '"product_id":102'
