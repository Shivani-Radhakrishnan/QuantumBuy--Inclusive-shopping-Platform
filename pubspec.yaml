name: shopping_app
description: "QuantumBuy: an accessible shopping app for people with disabilities."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.0.6
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background.jpg
    - assets/logo.png
    - assets/default_profile.png
    - assets/electronics/
    - assets/clothing/
    - assets/home_kitchen/
    - assets/beauty_personal_care/
    - assets/groceries/
